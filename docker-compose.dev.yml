services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce-mtc
    ports:
      - '5433:5432'
    volumes:
      - ecommerce-mtc-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: redis-server --appendonly yes
    ports:
      - '36379:6379'
    volumes:
      - ecommerce-mtc-redisdata:/data

volumes:
  ecommerce-mtc-pgdata:
  ecommerce-mtc-redisdata: